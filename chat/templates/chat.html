<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AskAI</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.07);
    --border2: rgba(0,0,0,0.12);
    --text: #1a1a18;
    --text2: #6b6b66;
    --text3: #adadaa;
    --accent: #e8500a;
    --accent2: #ff6b2b;
    --accent-bg: #fff2ed;
    --accent-glow: rgba(232,80,10,0.18);
    --user-bg: #1a1a18;
    --user-text: #f5f5f0;
    --bot-bg: #eeeee9;
    --bot-text: #1a1a18;
    --drawer-bg: #0e0e12;
    --drawer-surface: #18181f;
    --drawer-border: rgba(255,255,255,0.06);
    --drawer-text: rgba(255,255,255,0.85);
    --drawer-muted: rgba(255,255,255,0.35);
    --radius: 18px;
    --radius-sm: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.14);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    height: -webkit-fill-available;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* ── APP SHELL ── */
  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* ── TOPBAR ── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(var(--safe-top) + 10px) 14px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  .menu-btn {
    width: 38px; height: 38px;
    background: var(--surface2);
    border: none;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.12s;
  }
  .menu-btn:active { background: #e0dfd9; }
  .menu-btn svg { width: 18px; height: 18px; fill: var(--text); }

  .topbar-center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .brand-dot {
    width: 22px; height: 22px;
    background: var(--accent);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-dot svg { width: 11px; height: 11px; fill: white; }

  .topbar-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .clear-btn {
    width: 38px; height: 38px;
    background: var(--surface2);
    border: none;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.12s;
  }
  .clear-btn:active { background: #e0dfd9; }
  .clear-btn svg { width: 16px; height: 16px; fill: var(--text2); }

  /* ── CHAT AREA ── */
  .chat-box {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 16px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    scroll-behavior: smooth;
  }

  .chat-box::-webkit-scrollbar { display: none; }

  /* ── EMPTY STATE ── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    min-height: 60vh;
  }

  .empty-logo {
    width: 60px; height: 60px;
    background: var(--accent);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px var(--accent-glow);
  }
  .empty-logo svg { width: 28px; height: 28px; fill: white; }

  .empty-state h2 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
    margin-bottom: 8px;
  }

  .empty-state p {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.6;
    max-width: 240px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 24px;
    max-width: 320px;
  }

  .chip {
    padding: 9px 15px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 50px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: all 0.15s;
    box-shadow: var(--shadow);
  }

  .chip:active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
    transform: scale(0.97);
  }

  /* ── MESSAGES ── */
  .msg-row {
    display: flex;
    gap: 8px;
    padding: 3px 0;
    animation: msgIn 0.22s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg-row.user { justify-content: flex-end; }
  .msg-row.bot  { justify-content: flex-start; }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
    margin-top: 2px;
    align-self: flex-end;
  }

  .avatar.bot-av {
    background: var(--accent);
  }
  .avatar.bot-av svg { width: 14px; height: 14px; fill: white; }

  .avatar.user-av {
    background: var(--user-bg);
    color: var(--user-text);
    font-size: 10px;
  }

  .bubble-col {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-width: min(75vw, 300px);
  }

  .msg-row.user .bubble-col { align-items: flex-end; }
  .msg-row.bot  .bubble-col { align-items: flex-start; }

  .bubble {
    padding: 11px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.6;
    word-break: break-word;
  }

  .bubble.user {
    background: var(--user-bg);
    color: var(--user-text);
    border-bottom-right-radius: 5px;
    font-weight: 400;
  }

  .bubble.bot {
    background: var(--bot-bg);
    color: var(--bot-text);
    border-bottom-left-radius: 5px;
  }

  .msg-time {
    font-size: 11px;
    color: var(--text3);
    padding: 0 4px;
  }

  /* ── TYPING ── */
  .typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 13px 16px;
    background: var(--bot-bg);
    border-radius: 18px;
    border-bottom-left-radius: 5px;
    width: fit-content;
  }

  .typing span {
    width: 7px; height: 7px;
    background: var(--text3);
    border-radius: 50%;
    display: inline-block;
    animation: blink 1.3s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }

  @keyframes blink {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* ── DATE DIVIDER ── */
  .date-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
  }
  .date-divider::before, .date-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .date-divider span {
    font-size: 11px;
    color: var(--text3);
    font-weight: 500;
    white-space: nowrap;
  }

  /* ── INPUT AREA ── */
  .input-area {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 12px calc(var(--safe-bottom) + 10px);
  }

  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--surface2);
    border: 1.5px solid var(--border2);
    border-radius: 20px;
    padding: 8px 8px 8px 16px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .input-row:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
    background: var(--surface);
  }

  #msgInput {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    color: var(--text);
    resize: none;
    min-height: 24px;
    max-height: 110px;
    overflow-y: auto;
    line-height: 1.5;
  }

  #msgInput::-webkit-scrollbar { display: none; }
  #msgInput::placeholder { color: var(--text3); }

  .send-btn {
    width: 38px; height: 38px;
    border: none;
    border-radius: 13px;
    background: #d0d0ca;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.18s cubic-bezier(0.34,1.56,0.64,1);
  }

  .send-btn.on {
    background: var(--accent);
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  .send-btn.on:active { transform: scale(0.92); }
  .send-btn svg { width: 16px; height: 16px; fill: white; }

  /* ── DRAWER OVERLAY ── */
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
    backdrop-filter: blur(2px);
  }

  .drawer-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  /* ── DRAWER ── */
  .drawer {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 80vw;
    max-width: 300px;
    background: var(--drawer-bg);
    z-index: 101;
    display: flex;
    flex-direction: column;
    transform: translateX(-100%);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    will-change: transform;
    overflow: hidden;
  }

  .drawer.open {
    transform: translateX(0);
    box-shadow: 4px 0 40px rgba(0,0,0,0.4);
  }

  .drawer-header {
    padding: calc(var(--safe-top) + 16px) 18px 16px;
    border-bottom: 1px solid var(--drawer-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .drawer-brand {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .drawer-brand-dot {
    width: 26px; height: 26px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .drawer-brand-dot svg { width: 13px; height: 13px; fill: white; }

  .drawer-brand-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--drawer-text);
    letter-spacing: -0.3px;
  }

  .drawer-close {
    width: 30px; height: 30px;
    background: rgba(255,255,255,0.07);
    border: none;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--drawer-muted);
    font-size: 16px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: background 0.12s;
  }
  .drawer-close:active { background: rgba(255,255,255,0.12); }

  .new-btn {
    margin: 14px 14px 4px;
    padding: 11px 14px;
    background: rgba(232,80,10,0.15);
    border: 1px solid rgba(232,80,10,0.35);
    border-radius: 12px;
    color: #ff8c5a;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s;
    letter-spacing: -0.2px;
  }
  .new-btn:active {
    background: rgba(232,80,10,0.25);
    transform: scale(0.98);
  }
  .new-btn .plus { font-size: 18px; line-height: 1; }

  .drawer-section {
    padding: 10px 14px 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--drawer-muted);
  }

  .hist-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px;
    -webkit-overflow-scrolling: touch;
  }

  .hist-list::-webkit-scrollbar { display: none; }

  .hist-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 10px;
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.12s;
    margin: 1px 0;
  }

  .hist-item:active, .hist-item.active { background: var(--drawer-surface); }

  .hist-icon { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.35; fill: white; }

  .hist-label {
    flex: 1;
    font-size: 13.5px;
    color: rgba(255,255,255,0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 400;
  }

  .hist-item.active .hist-label { color: rgba(255,255,255,0.9); font-weight: 500; }

  .hist-del {
    opacity: 0;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    color: rgba(255,255,255,0.3);
    font-size: 12px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: all 0.1s;
  }

  .hist-item:active .hist-del { opacity: 1; }

  .drawer-footer {
    padding: 14px 18px calc(var(--safe-bottom) + 14px);
    border-top: 1px solid var(--drawer-border);
  }

  .drawer-footer-text {
    font-size: 12px;
    color: var(--drawer-muted);
    line-height: 1.5;
  }

  .drawer-footer-text strong {
    color: rgba(255,255,255,0.5);
    font-weight: 600;
  }

  /* ── SCROLL TO BOTTOM ── */
  .scroll-btn {
    position: absolute;
    bottom: 90px;
    right: 16px;
    width: 36px; height: 36px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    z-index: 5;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }

  .scroll-btn.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
  }

  .scroll-btn svg { width: 15px; height: 15px; fill: var(--text2); }
</style>
</head>
<body>

<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <button class="menu-btn" onclick="openDrawer()">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </button>
    <div class="topbar-center">
      <div class="brand-dot">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      </div>
      <div class="topbar-title" id="chatTitle">AskAI</div>
    </div>
    <button class="clear-btn" onclick="clearChat()" title="Clear">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
  </div>

  <!-- CHAT BOX -->
  <div class="chat-box" id="chatBox" onscroll="onChatScroll()">
    <div class="empty-state" id="emptyState">
      <div class="empty-logo">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      </div>
      <h2>Hey there! 👋</h2>
      <p>Ask me anything. I'm here to help you think, write, and explore.</p>
      <div class="chips">
        <button class="chip" onclick="useChip(this)">Explain a concept</button>
        <button class="chip" onclick="useChip(this)">Write some code</button>
        <button class="chip" onclick="useChip(this)">Brainstorm ideas</button>
        <button class="chip" onclick="useChip(this)">Summarize text</button>
      </div>
    </div>
  </div>

  <!-- SCROLL TO BOTTOM -->
  <button class="scroll-btn" id="scrollBtn" onclick="scrollToBottom()">
    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
  </button>

  <!-- INPUT AREA -->
  <div class="input-area">
    <div class="input-row">
      <textarea
        id="msgInput"
        placeholder="Message…"
        rows="1"
        onkeydown="onKey(event)"
        oninput="resize(this); toggleSend()"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

</div>

<!-- DRAWER OVERLAY -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<!-- DRAWER -->
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-brand">
      <div class="drawer-brand-dot">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      </div>
      <span class="drawer-brand-name">AskAI</span>
    </div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>

  <button class="new-btn" onclick="newChat(); closeDrawer()">
    <span class="plus">+</span> New conversation
  </button>

  <div class="drawer-section">Recent chats</div>
  <div class="hist-list" id="histList"></div>

  <div class="drawer-footer">
    <div class="drawer-footer-text">
      <strong>AskAI</strong> · Powered by your Django backend.<br>
      All conversations are private.
    </div>
  </div>
</div>

<script>
  // ── State ─────────────────────────────────────────────────
  let currentSession = null;
  let sessions = [];
  let sessionCounter = 1;

  // ── Utilities ─────────────────────────────────────────────
  const $ = id => document.getElementById(id);

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function now() {
    return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function csrf() {
    return document.cookie.split('; ')
      .find(r => r.startsWith('csrftoken='))?.split('=')[1] || '';
  }

  // ── Input helpers ─────────────────────────────────────────
  function resize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  }

  function toggleSend() {
    $('sendBtn').classList.toggle('on', $('msgInput').value.trim().length > 0);
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 640) {
      e.preventDefault();
      sendMessage();
    }
  }

  function useChip(btn) {
    $('msgInput').value = btn.textContent;
    $('msgInput').focus();
    toggleSend();
  }

  // ── Scroll ────────────────────────────────────────────────
  function scrollToBottom() {
    const box = $('chatBox');
    box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
  }

  function onChatScroll() {
    const box = $('chatBox');
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    $('scrollBtn').classList.toggle('visible', !nearBottom);
  }

  // ── Render messages ───────────────────────────────────────
  const botSvg = `<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>`;

  function addMsg(text, type, time) {
    const es = $('emptyState');
    if (es) es.remove();

    const box = $('chatBox');
    const isUser = type === 'user';
    const row = document.createElement('div');
    row.className = 'msg-row ' + type;

    const av = isUser
      ? `<div class="avatar user-av">Me</div>`
      : `<div class="avatar bot-av">${botSvg}</div>`;

    const col = `
      <div class="bubble-col">
        <div class="bubble ${type}">${esc(text)}</div>
        <div class="msg-time">${time || now()}</div>
      </div>`;

    row.innerHTML = isUser ? col + av : av + col;
    box.appendChild(row);
    scrollToBottom();
  }

  function showTyping() {
    const es = $('emptyState');
    if (es) es.remove();
    const box = $('chatBox');
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typingRow';
    row.innerHTML = `
      <div class="avatar bot-av">${botSvg}</div>
      <div class="bubble-col">
        <div class="typing"><span></span><span></span><span></span></div>
      </div>`;
    box.appendChild(row);
    scrollToBottom();
  }

  function hideTyping() {
    const t = $('typingRow');
    if (t) t.remove();
  }

  // ── Send ──────────────────────────────────────────────────
  function sendMessage() {
    const input = $('msgInput');
    const msg = input.value.trim();
    if (!msg) return;

    if (!currentSession) {
      currentSession = sessionCounter++;
      const label = msg.length > 32 ? msg.slice(0, 32) + '…' : msg;
      sessions.push({ id: currentSession, label });
      $('chatTitle').textContent = label.length > 18 ? label.slice(0, 18) + '…' : label;
      renderHist();
    }

    addMsg(msg, 'user');
    input.value = '';
    input.style.height = 'auto';
    toggleSend();
    showTyping();

    // ── Django backend ────────────────────────────────────
    fetch('/chat/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        'X-CSRFToken': csrf()
      },
      body: `message=${encodeURIComponent(msg)}&session_id=${currentSession}`
    })
    .then(r => r.json())
    .then(data => {
      hideTyping();
      addMsg(data.response, 'bot');
      if (data.session_id) currentSession = data.session_id;
    })
    .catch(() => {
      hideTyping();
      addMsg('Something went wrong. Please try again.', 'bot');
    });
  }

  // ── History ───────────────────────────────────────────────
  function renderHist() {
    const list = $('histList');
    list.innerHTML = '';
    [...sessions].reverse().forEach(s => {
      const item = document.createElement('div');
      item.className = 'hist-item' + (s.id === currentSession ? ' active' : '');
      item.innerHTML = `
        <svg class="hist-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        <span class="hist-label" onclick="loadChat(${s.id})">${esc(s.label)}</span>
        <button class="hist-del" onclick="deleteChat(${s.id})">✕</button>`;
      list.appendChild(item);
    });
  }

  function loadChat(id) {
    currentSession = id;
    const s = sessions.find(x => x.id === id);
    $('chatTitle').textContent = s
      ? (s.label.length > 18 ? s.label.slice(0,18)+'…' : s.label)
      : 'Chat';
    closeDrawer();
    renderHist();

    fetch(`/load/${id}/`)
      .then(r => r.json())
      .then(data => {
        $('chatBox').innerHTML = '';
        if (data.messages.length) {
          const divider = document.createElement('div');
          divider.className = 'date-divider';
          divider.innerHTML = `<span>Today</span>`;
          $('chatBox').appendChild(divider);
        }
        data.messages.forEach(m => {
          addMsg(m.user, 'user');
          addMsg(m.bot, 'bot');
        });
      });
  }

  function deleteChat(id) {
    fetch(`/delete/${id}/`).then(() => {
      sessions = sessions.filter(s => s.id !== id);
      if (currentSession === id) newChat();
      else renderHist();
    });
  }

  function clearChat() {
    if (!currentSession) return;
    fetch(`/clear/${currentSession}/`).then(resetBox);
  }

  function newChat() {
    currentSession = null;
    $('chatTitle').textContent = 'AskAI';
    resetBox();
    renderHist();
    $('msgInput').focus();
  }

  function resetBox() {
    $('chatBox').innerHTML = `
      <div class="empty-state" id="emptyState">
        <div class="empty-logo">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        </div>
        <h2>Hey there! 👋</h2>
        <p>Ask me anything. I'm here to help you think, write, and explore.</p>
        <div class="chips">
          <button class="chip" onclick="useChip(this)">Explain a concept</button>
          <button class="chip" onclick="useChip(this)">Write some code</button>
          <button class="chip" onclick="useChip(this)">Brainstorm ideas</button>
          <button class="chip" onclick="useChip(this)">Summarize text</button>
        </div>
      </div>`;
  }

  // ── Drawer ────────────────────────────────────────────────
  function openDrawer() {
    $('drawer').classList.add('open');
    $('drawerOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeDrawer() {
    $('drawer').classList.remove('open');
    $('drawerOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  // Swipe-to-close drawer
  let touchStartX = 0;
  $('drawer').addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });

  $('drawer').addEventListener('touchend', e => {
    const dx = touchStartX - e.changedTouches[0].clientX;
    if (dx > 60) closeDrawer();
  }, { passive: true });

  // Replace below with Django template tags:
  // {% for s in sessions %}
  // sessions.push({ id: {{ s.id }}, label: "Chat {{ s.id }}" });
  // {% endfor %}
  // renderHist();
</script>

</body>
